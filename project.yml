name: MyFirstApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  MyFirstApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyFirstApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myfirstapp
        PRODUCT_NAME: MyFirstApp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "MyFirstApp"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
